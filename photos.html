
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Photos | ThingsInPhotos</title>
  <meta name="description" content="Browse the product, macro and creative photography portfolio at ThingsInPhotos.">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 24px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid #333;
    }

    .logo {
      color: #f5f5f5;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #c6a15b;
    }

    nav a {
      color: #f5f5f5;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    nav a:hover {
      color: #c6a15b;
    }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 55px 5%;
    }

    h1 {
      font-size: clamp(32px, 5vw, 52px);
      margin: 0 0 12px;
    }

    .intro {
      color: #aaa;
      margin: 0 0 35px;
      line-height: 1.6;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: 260px;
      object-fit: cover;
      cursor: zoom-in;
      transition: opacity 0.2s;
    }

    .gallery img:hover {
      opacity: 0.8;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.96);
      align-items: center;
      justify-content: center;
      padding: 60px 70px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
    }

    .lightbox button {
      position: absolute;
      border: 0;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 36px;
      padding: 10px;
      line-height: 1;
    }

    .close {
      top: 12px;
      right: 20px;
    }

    .prev {
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    .next {
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .gallery img {
        height: 220px;
      }
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      nav a {
        margin: 0 16px 0 0;
      }

      main {
        padding-top: 35px;
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      .gallery img {
        height: 170px;
      }

      .lightbox {
        padding: 50px 42px;
      }

      .lightbox button {
        font-size: 28px;
      }

      .prev {
        left: 2px;
      }

      .next {
        right: 2px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">THINGS<span>IN</span>PHOTOS</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="photos.html">All Photos</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <h1>All Photos</h1>
    <p class="intro">A closer look at the things I've photographed.</p>

    <div class="gallery">
      <img src="images/dpt%204.jpg" alt="Product photography">
      <img src="images/gizmo.jpg" alt="Macro photography">
      <img src="images/bf2.jpg" alt="Creative photography">

      <!-- Copy a line above for each additional image -->
      <!-- Replace the filename and alt text with your own -->
    </div>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="close" aria-label="Close image">&times;</button>
    <button class="prev" aria-label="Previous image">&#10094;</button>
    <img id="lightbox-image" src="" alt="">
    <button class="next" aria-label="Next image">&#10095;</button>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const images = Array.from(document.querySelectorAll('.gallery img'));
    let current = 0;

    function showImage(index) {
      current = (index + images.length) % images.length;
      lightboxImage.src = images[current].src;
      lightboxImage.alt = images[current].alt;
    }

    function openImage(index) {
      showImage(index);
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeImage() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    images.forEach((img, index) => {
      img.addEventListener('click', () => openImage(index));
    });

    lightbox.querySelector('.close').addEventListener('click', closeImage);
    lightbox.querySelector('.prev').addEventListener('click', () => showImage(current - 1));
    lightbox.querySelector('.next').addEventListener('click', () => showImage(current + 1));

    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeImage();
    });

    document.addEventListener('keydown', event => {
      if (!lightbox.classList.contains('open')) return;
      if (event.key === 'Escape') closeImage();
      if (event.key === 'ArrowLeft') showImage(current - 1);
      if (event.key === 'ArrowRight') showImage(current + 1);
    });
  </script>
</body>
</html>
